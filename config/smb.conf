# ชุดติดตั้งดูแลไฟล์นี้ทั้งไฟล์ สำเนาเดิมอยู่ใน /var/backups/scpprint-*
[global]
   workgroup = WORKGROUP
   server string = Armbian SCPPrint
   server role = standalone server
   map to guest = Bad User
   guest account = nobody
   printing = cups
   printcap name = cups
   load printers = yes
   cups options = raw
   disable spoolss = no
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 100

[printers]
   comment = SCPPrint Printers
   path = /var/spool/samba
   browseable = no
   printable = yes
   guest ok = yes
   guest only = yes
   read only = yes
   create mask = 0600
